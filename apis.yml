aid: calo
name: Calo
description: >-
  Calo is a food-tech company founded in Bahrain in 2019 that operates a
  personalized meal-subscription and delivery service. Nutritionist-designed,
  chef-prepared meals are portioned to each customer's health goals and lifestyle,
  with 80+ new meal options rotated weekly and flexible pause/cancel anytime.
  Built by chefs, nutritionists, and software engineers around proprietary
  nutritional algorithms, Calo has expanded to seven markets across the GCC and
  beyond (Saudi Arabia, United Arab Emirates, Kuwait, Qatar, Bahrain, and Oman),
  ordered through its consumer apps. Calo is backed by 500 Global. It is a
  consumer-facing product with no public developer API or documented client SDKs.
